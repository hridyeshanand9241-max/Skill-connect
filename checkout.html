```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillConnect - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="checkout-container">
        <h1>Course Checkout</h1>

        <div class="checkout-card">
            <h2 id="courseName">Loading course...</h2>
            <p>Course Price: <strong id="coursePrice">₹0</strong></p>

            <label for="paymentMethod">Choose a demo payment method:</label>

            <select id="paymentMethod">
                <option value="UPI">UPI (Demo)</option>
                <option value="Card">Debit/Credit Card (Demo)</option>
                <option value="Net Banking">Net Banking (Demo)</option>
            </select>

            <button id="payButton">Complete Demo Purchase</button>

            <p id="paymentMessage" aria-live="polite"></p>

            <button type="button" onclick="history.back()">
                Back
            </button>
        </div>
    </div>

    <script src="checkout.js"></script>
</body>
</html>
